# Server Port (Dynamic for cloud providers, falls back to 8080 locally)
server.port=${PORT:8080}

# Aiven MySQL Database Connection (Secured via Environment Variables)
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-34adee96-yuvrajsinghpawar1235-5e85.j.aivencloud.com:26076/servicesphere?useSSL=true&requireSSL=true&sslMode=REQUIRED&serverTimezone=UTC&connectTimeout=30000&socketTimeout=60000}
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Tuning for Cloud Latency
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=10000

# Completely Disable Flyway
spring.flyway.enabled=false

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true